<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Breeze TTS 服务控制</title>
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="logo">♪</span>
        <div>
          <h1>Breeze TTS 服务控制</h1>
          <p class="subtitle" id="subtitle">正在读取状态…</p>
        </div>
      </div>
      <div class="toolbar">
        <span class="pill" id="state-pill"><i class="dot"></i><span id="state-text">未知</span></span>
        <button type="button" class="ghost" id="refresh-btn">刷新</button>
      </div>
    </header>

    <div class="banner" id="banner" hidden></div>

    <main>
      <article class="card">
        <div class="card-head">
          <h2>服务</h2>
          <span class="muted" id="service-hint">—</span>
        </div>

        <div class="facts">
          <div class="fact"><span class="k">端口</span><span class="v" id="fact-port">—</span></div>
          <div class="fact"><span class="k">进程</span><span class="v" id="fact-pid">—</span></div>
          <div class="fact"><span class="k">模型</span><span class="v" id="fact-model">—</span></div>
        </div>

        <div class="row">
          <label class="field">
            <span>启动参数</span>
            <select id="model-select"></select>
          </label>
          <label class="field">
            <span>音色</span>
            <select id="voice-select"></select>
          </label>
        </div>

        <div class="row actions">
          <button type="button" class="primary" id="start-btn">启动服务</button>
          <button type="button" class="danger" id="stop-btn">关闭服务</button>
          <button type="button" class="ghost" id="restart-btn">重启</button>
        </div>

        <p class="tip">
          服务在后台运行，关掉本页也继续跑；想释放显存就点「关闭服务」。
          模型目录、端口等设置请到 <strong>插件设置</strong> 里改。
        </p>
      </article>

      <article class="card studio" id="studio-card" hidden>
        <div class="card-head">
          <h2>音色工作台</h2>
          <span class="muted">本地音色库 · 克隆 · 试听</span>
        </div>

        <!-- 音色库 -->
        <div class="voice-table-wrap">
          <table class="voice-table">
            <thead>
              <tr>
                <th style="width: 34%">音色</th>
                <th style="width: 12%">时长</th>
                <th>描述</th>
                <th style="width: 25%"></th>
              </tr>
            </thead>
            <tbody id="voice-body">
              <tr><td colspan="4" class="muted">正在读取音色…</td></tr>
            </tbody>
          </table>
        </div>

        <div class="divider"></div>

        <!-- 克隆 -->
        <h3 class="sub-head">克隆新音色</h3>
        <p class="tip">
          给一段 3~20 秒的干净人声（<strong>只支持 WAV</strong>），填上它说的每一个字，就能生成新音色。
        </p>
        <div class="row">
          <label class="field">
            <span>参考音频（WAV，≤10 MB）</span>
            <input type="file" id="clone-file" accept=".wav,audio/wav" />
          </label>
          <label class="field">
            <span>名称（英文 / 数字 / - / _）</span>
            <input type="text" id="clone-name" placeholder="例如 fish-voice" />
          </label>
        </div>
        <label class="field">
          <span>这段音频里说的每一个字（必须逐字一致）</span>
          <textarea id="clone-text" placeholder="例如：海风吹过甲板，我把月亮当成回家的路标。"></textarea>
        </label>
        <label class="field">
          <span>描述（可选，方便以后区分）</span>
          <input type="text" id="clone-desc" placeholder="例如：温柔、偏慢、略带气声" />
        </label>
        <div class="row actions">
          <button type="button" class="ghost" id="clone-preview-btn">试听参考音频</button>
          <button type="button" class="primary" id="clone-btn">克隆并保存</button>
        </div>

        <div class="divider"></div>

        <!-- 试听 -->
        <h3 class="sub-head">试听</h3>
        <p class="tip">不用去群里发消息，这里直接合成一段听听效果。</p>
        <label class="field">
          <span>文本</span>
          <textarea id="preview-text">海面上的月光很亮，我想和你说一声晚安啦。</textarea>
        </label>
        <div class="row">
          <label class="field">
            <span>音色</span>
            <select id="preview-voice"></select>
          </label>
          <label class="field">
            <span>语速（-50 ~ 100，推荐 ±20 以内）</span>
            <input type="number" id="preview-speed" min="-50" max="100" step="5" value="0" />
          </label>
          <label class="field">
            <span>音调（-12 ~ +12 半音，推荐 ±4 以内）</span>
            <input type="number" id="preview-pitch" min="-12" max="12" step="1" value="0" />
          </label>
        </div>
        <div class="row actions">
          <button type="button" class="primary" id="preview-btn">合成试听</button>
        </div>
        <div class="player" id="player" hidden>
          <span class="player-icon">▶</span>
          <audio id="preview-audio" controls></audio>
        </div>

        <p class="tip studio-foot">
          需要模型可视化或原始克隆面板？<a href="#" id="native-link">打开 Breeze 原生界面</a>
        </p>
      </article>
    </main>

    <div class="toast" id="toast" hidden></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
