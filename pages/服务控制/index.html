<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Breeze TTS 服务控制</title>
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="logo">♪</span>
        <div>
          <h1>Breeze TTS 服务控制</h1>
          <p class="subtitle" id="subtitle">正在读取状态…</p>
        </div>
      </div>
      <div class="toolbar">
        <span class="pill" id="state-pill"><i class="dot"></i><span id="state-text">未知</span></span>
        <button type="button" class="ghost" id="refresh-btn">刷新</button>
      </div>
    </header>

    <div class="banner" id="banner" hidden></div>

    <main>
      <article class="card">
        <div class="card-head">
          <h2>服务</h2>
          <span class="muted" id="service-hint">—</span>
        </div>

        <div class="facts">
          <div class="fact"><span class="k">端口</span><span class="v" id="fact-port">—</span></div>
          <div class="fact"><span class="k">进程</span><span class="v" id="fact-pid">—</span></div>
          <div class="fact"><span class="k">模型</span><span class="v" id="fact-model">—</span></div>
        </div>

        <div class="row">
          <label class="field">
            <span>启动参数</span>
            <select id="model-select"></select>
          </label>
          <label class="field">
            <span>音色</span>
            <select id="voice-select"></select>
          </label>
        </div>

        <div class="row actions">
          <button type="button" class="primary" id="start-btn">启动服务</button>
          <button type="button" class="danger" id="stop-btn">关闭服务</button>
          <button type="button" class="ghost" id="restart-btn">重启</button>
        </div>

        <p class="tip">
          服务在后台运行，关掉本页也继续跑；想释放显存就点「关闭服务」。
          模型目录、端口等设置请到 <strong>插件设置</strong> 里改。
        </p>
      </article>

      <details class="card viz" id="viz-card">
        <summary>
          <span class="viz-title">模型可视化页面</span>
          <span class="muted" id="viz-hint">服务未连接</span>
        </summary>
        <div class="viz-body">
          <p class="muted viz-empty" id="viz-empty">服务未连接，启动服务后这里会自动显示模型网页。</p>
          <iframe id="viz-frame" class="viz-frame" title="Breeze 模型可视化页面" loading="lazy" referrerpolicy="no-referrer" hidden></iframe>
        </div>
      </details>
    </main>

    <div class="toast" id="toast" hidden></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
